<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>단톡방 생존 퀴즈</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css">
<style>
:root{--bg:#1e2233;--pn:#2b3049;--ln:#454c6e;--tx:#eef0f6;--dim:#9aa1bf;--y:#ffd84a;--g:#5ee08a;--r:#ff5c6c;--chat:#b2c7d9}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:'Galmuri11','Galmuri9','DungGeunMo',monospace,sans-serif;font-size:14px;image-rendering:pixelated;min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:100vh;padding:14px;display:flex;flex-direction:column}
.px{border:3px solid #0d0f18;box-shadow:inset -3px -3px 0 rgba(0,0,0,.25),inset 3px 3px 0 rgba(255,255,255,.12)}
button{font:inherit;color:inherit;cursor:pointer}
.scr{display:none;flex:1;flex-direction:column}.scr.on{display:flex}
h1{font-family:'Galmuri11',monospace;font-size:30px;line-height:1.3;text-align:center;color:var(--y);text-shadow:3px 3px 0 #0d0f18;margin:28px 0 6px}
.sub{text-align:center;color:var(--dim);margin-bottom:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 22px}
.mem{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px}
canvas.av{width:48px;height:48px;image-rendering:pixelated;background:var(--pn);border:3px solid #0d0f18}
.big{background:var(--y);color:#1e2233;font-size:18px;padding:14px;width:100%;margin-top:8px}
.big:active,.opt:active{transform:translate(2px,2px);box-shadow:none}
.best{text-align:center;color:var(--dim);margin-top:12px}
.rule{background:var(--pn);padding:12px;line-height:1.7;color:var(--dim);font-size:12px;margin-top:auto}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.hearts span{display:inline-block;width:18px;height:16px;margin-right:4px;background:var(--r);clip-path:polygon(0 25%,12% 0,38% 0,50% 18%,62% 0,88% 0,100% 25%,100% 50%,50% 100%,0 50%)}
.hearts span.off{background:#3a3f58}
.combo{color:var(--y);height:18px;text-align:right;font-size:12px}
.bar{height:12px;background:#0d0f18;margin:6px 0 10px;padding:2px}
.bar i{display:block;height:100%;background:var(--g);width:100%}
.room{background:var(--chat);padding:12px 10px;min-height:210px;display:flex;flex-direction:column;gap:8px;justify-content:flex-end}
.row{display:flex;gap:6px;align-items:flex-start}
.row canvas{width:32px;height:32px;border:2px solid #0d0f18;image-rendering:pixelated;flex:none;background:#fff}
.nm{font-size:11px;color:#33415a;margin-bottom:2px}
.bub{background:#fff;color:#1b1b1b;padding:7px 9px;border:2px solid #0d0f18;box-shadow:2px 2px 0 rgba(0,0,0,.2);max-width:250px;word-break:keep-all;overflow-wrap:anywhere;line-height:1.5;font-size:13px}
.row.q .bub{font-size:15px;background:#fffbe0}
.ctx{opacity:.7}.ctx .bub{font-size:12px}
.mys{width:32px;height:32px;border:2px solid #0d0f18;background:#33415a;color:var(--y);display:flex;align-items:center;justify-content:center;flex:none;font-size:16px}
.lv{font-size:11px;color:var(--dim);margin-top:8px;display:flex;justify-content:space-between}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.opt{background:var(--pn);padding:8px;display:flex;align-items:center;gap:8px;font-size:14px;text-align:left}
.opt canvas{width:28px;height:28px;image-rendering:pixelated;border:2px solid #0d0f18}
.opt.ok{background:var(--g);color:#0d0f18}.opt.no{background:var(--r);color:#0d0f18}
.opt:disabled{cursor:default}
.fb{height:22px;text-align:center;margin-top:10px;font-size:13px}
.shake{animation:sh .35s steps(4)}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pop{animation:pp .3s steps(3)}@keyframes pp{50%{transform:scale(1.06)}}
.score{font-size:44px;color:var(--y);text-align:center;text-shadow:3px 3px 0 #0d0f18;margin:6px 0}
.stat{background:var(--pn);padding:10px;margin:10px 0}
.st{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12px}
.st canvas{width:22px;height:22px;image-rendering:pixelated;border:2px solid #0d0f18}
.st b{width:44px;font-weight:normal}.st .gb{flex:1;height:10px;background:#0d0f18}.st .gb i{display:block;height:100%;background:var(--y)}
.st em{font-style:normal;width:60px;text-align:right;color:var(--dim)}
.sec{background:var(--pn);margin-top:8px;padding:12px;font-size:16px;width:100%}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--y);color:#1e2233;padding:8px 14px;border:3px solid #0d0f18;display:none}

.room{min-height:0;padding:8px;gap:3px;justify-content:flex-start}
.row{gap:5px}.row:not(.cont){margin-top:3px}
.row canvas,.mys,.sp{width:24px;height:24px;flex:none}.mys{font-size:12px}
.nm{font-size:10px;margin-bottom:1px}
.bub{font-size:12px;padding:4px 7px;line-height:1.4;max-width:270px;box-shadow:1px 1px 0 rgba(0,0,0,.2)}
.row.q .bub{font-size:13px;background:var(--y);border-color:#0d0f18;box-shadow:2px 2px 0 #0d0f18}
.bub.tag{background:#6f7da0;color:#fff;font-size:10px}
.opts{grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.opt{flex-direction:column;gap:3px;padding:6px 2px;font-size:11px;text-align:center;justify-content:center}
.opt canvas{width:26px;height:26px}
#app{padding:10px 12px}.bar{margin:4px 0 6px}.combo{height:14px}
.rk{background:var(--pn);padding:10px;margin-top:10px;font-size:12px}.rkh{color:var(--y);margin-bottom:6px}
.rr{display:flex;gap:8px;padding:3px 4px}.rr b{width:22px;font-weight:normal;color:var(--dim)}.rr span{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.rr.me{background:var(--y);color:#1e2233}.rr.me b{color:#1e2233}
#nick{flex:1;font:inherit;font-size:14px;padding:8px;background:#0d0f18;color:var(--tx);outline:none;min-width:0}
#s0 .rule{margin-top:10px}
.statq{margin:auto 0;text-align:center;padding:14px 6px}.stl{display:inline-block;background:#33415a;color:var(--y);padding:4px 8px;font-size:11px;border:2px solid #0d0f18}.stt{word-break:keep-all;color:#1b1b1b;font-size:17px;line-height:1.5;margin:14px 0;background:#fff;border:3px solid #0d0f18;padding:14px 10px;box-shadow:3px 3px 0 #0d0f18}.stv{color:#1b1b1b;font-size:15px;min-height:40px}.stv small{color:#4a5670;font-size:11px}.room{min-height:250px}
</style></head><body><div id="app">
<section class="scr on" id="sl"><h1>단톡방<br>생존 퀴즈</h1><div class="sub">🔒 멤버 전용</div>
<input id="pw" type="password" class="px" placeholder="비밀번호" autocomplete="current-password" style="font:inherit;font-size:18px;padding:12px;background:#0d0f18;color:var(--tx);width:100%;outline:none">
<label style="margin:10px 0;color:var(--dim);font-size:12px"><input type="checkbox" id="rem"> 이 기기에서 기억하기</label>
<button class="big px" id="unlock">열기</button><div class="fb" id="pwmsg"></div></section>
<section class="scr" id="s0">
<h1>단톡방<br>생존 퀴즈</h1><div class="sub">이 말, 누가 했게?</div>
<div class="grid" id="mems"></div>
<button class="big px" id="start">▶ 시작하기</button>
<div class="best" id="best0"></div><div class="rk px"><div class="rkh">🏆 TOP 10</div><div class="rkl" id="rk0">불러오는 중...</div></div>
<div class="rule px">♥ 목숨 5개 · 틀리거나 시간 초과면 -1<br>⏱ 문제당 20초 · 연속 정답 시 콤보 보너스<br>💬 5년치 실제 대화에서 뽑은 307문제</div>
</section>
<section class="scr" id="s1">
<div class="hud"><div class="hearts" id="hearts"></div><div>SCORE <span id="sc">0</span></div></div>
<div class="combo" id="combo"></div>
<div class="bar"><i id="tbar"></i></div>
<div class="room px" id="room"></div>
<div class="lv"><span id="qn"></span><span id="lvl"></span></div>
<div class="opts" id="opts"></div>
<div class="fb" id="fb"></div>
</section>
<section class="scr" id="s2">
<h1 style="margin-top:14px">GAME OVER</h1>
<div class="score" id="fsc">0</div>
<div class="best" id="fbest"></div>
<div class="stat px"><div style="margin-bottom:6px">멤버별 정답률</div><div id="stats"></div></div>
<div class="rk px" id="regbox"><div class="rkh">랭킹 등록</div><div style="display:flex;gap:6px"><input id="nick" maxlength="12" placeholder="닉네임" class="px"><button class="sec px" id="reg" style="width:80px;margin:0">등록</button></div><div class="fb" id="regmsg" style="margin-top:6px;height:auto"></div></div><div class="rk px"><div class="rkh">🏆 TOP 10</div><div class="rkl" id="rk2"></div></div>
<button class="big px" id="again">↻ 다시 하기</button>
<button class="sec px" id="share">결과 문구 복사</button>
</section>
<div class="toast" id="toast">복사됐어요!</div>
</div>

// sound
let AC;function snd(type){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
const seq={ok:[[660,0],[880,.08],[1320,.16]],no:[[220,0],[160,.12]],tick:[[1000,0]],over:[[440,0],[330,.15],[262,.3],[196,.45]],start:[[523,0],[659,.08],[784,.16]]}[type];
seq.forEach(([f,d])=>{const o=AC.createOscillator(),gn=AC.createGain();o.type='square';o.frequency.value=f;gn.gain.setValueAtTime(.06,t+d);gn.gain.exponentialRampToValueAtTime(.001,t+d+.12);o.connect(gn).connect(AC.destination);o.start(t+d);o.stop(t+d+.13)})}catch(e){}}

else{st.combo=0;st.life--;snd('no');if(btn)btn.classList.add('no');$('room').classList.add('shake');setTimeout(()=>$('room').classList.remove('shake'),400);

function shareText(){const ok=st.per.reduce((a,p)=>a+p[0],0);const top=st.per.map((p,i)=>[p[1]?p[0]/p[1]:-1,i]).sort((a,b)=>b[0]-a[0])[0];

const SB='https://xdowpybbmtshggsyscbs.supabase.co/rest/v1/dantok_quiz_scores',SK='sb_publishable_3mVV7E1s9WqXaF9e5E6gDA_HpJweAIO',H={apikey:SK,'Content-Type':'application/json'};
let myId=null,myScore=null;
async function loadRank(){try{const r=await fetch(SB+'?select=id,nickname,score,correct&order=score.desc,created_at.asc&limit=10',{headers:H});const L=await r.json();
let extra='';if(myId&&!L.some(x=>x.id==myId)){const c=await fetch(SB+'?select=id&score=gt.'+myScore,{headers:{...H,Prefer:'count=exact',Range:'0-0'}});const n=+(c.headers.get('content-range')||'/0').split('/')[1];extra=`<div class="rr me"><b>${n+1}</b><span>${esc(localStorage.getItem('dtquiz_nick')||'')} (나)</span><em>${myScore}</em></div>`}
const h=L.length?L.map((x,i)=>`<div class="rr${x.id==myId?' me':''}"><b>${i+1}</b><span>${esc(x.nickname)}</span><em>${x.score}</em></div>`).join('')+extra:'아직 기록이 없어요';
['rk0','rk2'].forEach(id=>$(id).innerHTML=h)}catch(e){['rk0','rk2'].forEach(id=>$(id).textContent='랭킹을 불러오지 못했어요')}}
const esc=t=>String(t).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
$('nick').value=localStorage.getItem('dtquiz_nick')||'';
$('reg').onclick=async()=>{const n=$('nick').value.trim();if(!n||n.length>12){$('regmsg').textContent='닉네임 1~12자';return}
$('reg').disabled=true;try{const r=await fetch(SB,{method:'POST',headers:{...H,Prefer:'return=representation'},body:JSON.stringify({nickname:n,score:st.score,correct:st.per.reduce((a,p)=>a+p[0],0)})});if(!r.ok)throw 0;
const d=await r.json();myId=d[0].id;myScore=st.score;localStorage.setItem('dtquiz_nick',n);$('regmsg').textContent='등록 완료!';snd('ok');loadRank()}catch(e){$('regmsg').textContent='등록 실패 ㅠ';$('reg').disabled=false}};
const _show=show;show=n=>{_show(n);if(n==0||n==2)loadRank();if(n==2){$('reg').disabled=false;$('regmsg').textContent='';myId=null}};

const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0)),KK='dtquiz_key';
async function tryKey(raw){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(ENC.i)},k,u8(ENC.c));Q=JSON.parse(new TextDecoder().decode(pt));show(0)}
async function unlock(){const pw=$('pw').value;if(!pw)return;$('pwmsg').textContent='여는 중...';
try{const bk=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
const raw=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:u8(ENC.s),iterations:ENC.n},bk,256));
await tryKey(raw);if($('rem').checked)localStorage.setItem(KK,btoa(String.fromCharCode(...raw)));$('pwmsg').textContent=''}
catch(e){snd('no');$('pwmsg').innerHTML='<span style="color:var(--r)">틀렸다!</span>';const p=$('pw');p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake');p.value=''}}
$('unlock').onclick=unlock;$('pw').onkeydown=e=>{if(e.key=='Enter')unlock()};
(async()=>{const s=localStorage.getItem(KK);if(s){try{await tryKey(u8(s))}catch(e){localStorage.removeItem(KK)}}})();
